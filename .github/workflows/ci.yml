name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails loudly if package-lock.json and package.json disagree,
      # which is what we want on CI.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fails on high or critical only. Moderate advisories in build-time
      # dependencies shouldn't block a marketing site's deploy at 3am.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # A marketing site that ships 300kB of JS has stopped being a marketing site.
      # The budget is deliberately close to current (~102kB shared) so a careless
      # dependency shows up here rather than in someone's field data.
      - name: Bundle budget
        run: |
          BYTES=$(find .next/static/chunks -name '*.js' -not -path '*/app/*' -printf '%s\n' \
            | awk '{t+=$1} END {print t}')
          KB=$((BYTES / 1024))
          echo "Shared client chunks: ${KB}kB"
          if [ "$KB" -gt 400 ]; then
            echo "::error::Shared JS is ${KB}kB, over the 400kB budget."
            exit 1
          fi
