name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails loudly if package-lock.json and package.json disagree,
      # which is what we want on CI.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Output is kept so the bundle budget can read the shared first-load
      # figure Next itself reports, rather than re-deriving it from disk.
      # pipefail matters here: without it, tee's exit code masks a failed build.
      - name: Build
        run: |
          set -o pipefail
          npm run build | tee build.log

      # Fails on high or critical only. Moderate advisories in build-time
      # dependencies shouldn't block a marketing site's deploy at 3am.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # A marketing site that ships 300kB of JS has stopped being a marketing site.
      # The budget is deliberately close to current (~102kB shared) so a careless
      # dependency shows up here rather than in someone's field data.
      #
      # This reads Next's own "First Load JS shared by all" line — the bytes every
      # visitor actually downloads. Summing .next/static/chunks instead counts
      # per-route chunks, polyfills and framework chunks nobody loads in one visit,
      # which reported 784kB against a real shared figure of 102kB.
      - name: Bundle budget
        run: |
          LINE=$(grep -F 'First Load JS shared by all' build.log | tail -1)
          if [ -z "$LINE" ]; then
            echo "::error::Could not find the shared First Load JS line in the build output."
            exit 1
          fi

          # e.g. "+ First Load JS shared by all   102 kB" -> KB, rounded down.
          KB=$(printf '%s\n' "$LINE" | awk '
            {
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^[0-9]+(\.[0-9]+)?$/) { n = $(i); u = $(i + 1) }
              }
            }
            END {
              if (u ~ /^MB/) n = n * 1024
              printf "%d", n
            }')

          echo "Shared first-load JS: ${KB}kB"
          if [ "$KB" -gt 400 ]; then
            echo "::error::Shared JS is ${KB}kB, over the 400kB budget."
            exit 1
          fi
